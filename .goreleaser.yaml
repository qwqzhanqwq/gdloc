# GoReleaser v2 配置：推送 v* tag 后由 .github/workflows/release.yml 调用。
version: 2

project_name: gdloc

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: gdloc
    main: ./cmd/gdloc
    binary: gdloc
    env:
      # 纯 Go，关掉 cgo 才能稳定交叉编译出静态二进制。
      - CGO_ENABLED=0
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: gdloc
    formats: [tar.gz]
    # Scoop 与 winget 只接受 zip。
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - README.zh-CN.md

# 发布后把 manifest 推送到 Scoop bucket 仓库，用户通过 scoop bucket add 获取。
scoops:
  - name: gdloc
    repository:
      owner: qwqzhanqwq
      name: scoop-bucket
      # 自带的 GITHUB_TOKEN 只能写本仓库，跨仓库推送需要单独的 token。
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    directory: bucket
    homepage: https://github.com/qwqzhanqwq/gdloc
    description: Line counter for Godot 4 projects (GDScript, shaders, scenes).
    license: MIT
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "gdloc {{ .Tag }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
